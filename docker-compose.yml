services:
  botofferte:
    image: xrubby/botofferte:latest
    container_name: botofferte
    restart: unless-stopped
    environment:
      # TELEGRAM
      - TELEGRAM_TOKEN=il_tuo_token
      - USER_ID_ADMIN=il_tuo_id
      - BOT_USERNAME=username_del_bot
      # AMAZON
      - ACCESS_KEY=
      - SECRET_KEY=
      - ASSOCIATE_TAG=
      - REGION=
      # BITLY
      - BITLY_TOKEN=
      # DISCORD
      - DISCORD_TOKEN=
      # DATABASE POSTGRE
      - DATABASE_URL=postgresql+psycopg://username:password@IP:PORTA/NomeDB